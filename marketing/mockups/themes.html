<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="base.css">
<style>
.themes-row{position:absolute;top:1050px;left:0;right:0;display:flex;justify-content:center;align-items:center;}
.mini{width:356px;height:770px;border-radius:60px;background:#0B1C26;padding:15px;
  box-shadow:0 40px 90px rgba(28,94,107,0.28);position:relative;}
.mini.l{transform:rotate(-7deg) translate(64px,26px) scale(0.93);z-index:1;}
.mini.c{z-index:3;}
.mini.r{transform:rotate(7deg) translate(-64px,26px) scale(0.93);z-index:1;}
.ms{width:100%;height:100%;border-radius:47px;overflow:hidden;position:relative;padding:52px 24px 26px;display:flex;flex-direction:column;}
.mnotch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:110px;height:28px;background:#0B1C26;border-radius:15px;z-index:2;}
.mhd{display:flex;align-items:center;gap:10px;color:#fff;font-size:25px;font-weight:800;margin-bottom:18px;}
.mav{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:#fff;}
.mcard{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);border-radius:26px;padding:20px 22px;margin-bottom:15px;}
.mlabel{color:rgba(255,255,255,0.62);font-size:19px;font-weight:700;}
.mbig{color:#fff;font-size:54px;font-weight:800;letter-spacing:-1px;margin:3px 0 14px;}
.mbig .u{font-size:24px;opacity:0.6;}
.mtrack{height:15px;border-radius:8px;background:rgba(255,255,255,0.13);overflow:hidden;}
.mfill{height:100%;border-radius:8px;width:64%;}
.mrow{display:flex;align-items:center;gap:12px;padding:9px 0;}
.mico{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,0.14);display:flex;align-items:center;justify-content:center;font-size:22px;}
.mname{color:#fff;font-size:22px;font-weight:800;}
.mamt{margin-left:auto;color:#fff;font-size:24px;font-weight:800;}
.mbtn{margin:auto auto 0;width:98px;height:98px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,0.28);}
.mtheme{text-align:center;color:rgba(255,255,255,0.9);font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-top:16px;}
.mhomebar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);width:130px;height:7px;border-radius:5px;background:rgba(255,255,255,0.5);}
</style></head><body>
<div class="frame">
  <div class="cap">
    <div class="kick"><span class="dot"></span> Make it yours</div>
    <h1>Calm, in <span class="g">your colour.</span></h1>
    <p>A space you'll actually enjoy opening at 3am — pick the theme that feels like you.</p>
  </div>
  <div class="themes-row">
    <div class="mini l"><div class="ms" style="background:linear-gradient(rgba(0,0,0,0.13),rgba(0,0,0,0.13)),linear-gradient(165deg,#A488DD,#46357F);">
      <div class="mnotch"></div>
      <div class="mhd"><span class="mav" style="background:rgba(255,255,255,0.22);">M</span> Mila</div>
      <div class="mcard"><div class="mlabel">Milk today</div><div class="mbig">273<span class="u"> ml</span></div><div class="mtrack"><div class="mfill" style="background:#BFA9F5;"></div></div></div>
      <div class="mcard" style="padding:5px 22px;"><div class="mrow"><div class="mico">🍼</div><div class="mname">Pumped</div><div class="mamt">124</div></div></div>
      <div class="mbtn" style="background:#BFA9F5;"><svg width="42" height="42" viewBox="0 0 24 24" fill="#46357F"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg></div>
      <div class="mtheme">Lavender</div><div class="mhomebar"></div>
    </div></div>
    <div class="mini c"><div class="ms" style="background:linear-gradient(170deg,#528E95,#2C5E67 50%,#143139);">
      <div class="mnotch"></div>
      <div class="mhd"><span class="mav" style="background:rgba(90,200,218,0.32);">M</span> Mila</div>
      <div class="mcard"><div class="mlabel">Milk today</div><div class="mbig">273<span class="u"> ml</span></div><div class="mtrack"><div class="mfill" style="background:#5AC8DA;"></div></div></div>
      <div class="mcard" style="padding:5px 22px;"><div class="mrow"><div class="mico">🥣</div><div class="mname">Lunch</div><div class="mamt" style="font-size:21px;color:#9BE6B0;">Loved</div></div></div>
      <div class="mbtn" style="background:#5AC8DA;"><svg width="42" height="42" viewBox="0 0 24 24" fill="#143139"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg></div>
      <div class="mtheme">Ocean</div><div class="mhomebar"></div>
    </div></div>
    <div class="mini r"><div class="ms" style="background:linear-gradient(rgba(0,0,0,0.13),rgba(0,0,0,0.13)),linear-gradient(165deg,#7BC08A,#1F5235);">
      <div class="mnotch"></div>
      <div class="mhd"><span class="mav" style="background:rgba(255,255,255,0.22);">M</span> Mila</div>
      <div class="mcard"><div class="mlabel">Milk today</div><div class="mbig">273<span class="u"> ml</span></div><div class="mtrack"><div class="mfill" style="background:#B7EAC0;"></div></div></div>
      <div class="mcard" style="padding:5px 22px;"><div class="mrow"><div class="mico">🤱</div><div class="mname">Breast</div><div class="mamt">15<span style="font-size:17px;opacity:0.6;">m</span></div></div></div>
      <div class="mbtn" style="background:#76D596;"><svg width="42" height="42" viewBox="0 0 24 24" fill="#1F5235"><path d="M13 2L4.5 13.5H11l-1 8.5 8.5-11.5H12z"/></svg></div>
      <div class="mtheme">Forest</div><div class="mhomebar"></div>
    </div></div>
  </div>
</div>
</body></html>
