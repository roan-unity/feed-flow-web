<html lang="en">
<head>
<meta charset="utf-8">
<!-- OG card source (1200×630). Rendered to /og.png via headless Chrome:
     chrome --headless --screenshot --window-size=1200,630 og-src/home-card.html
     Kept in the repo so the artwork is regenerable. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  .card {
    width: 1200px; height: 630px; position: relative;
    background: linear-gradient(132deg, #58A9B3 0%, #2F7886 48%, #1C5E6B 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Baloo 2", system-ui, -apple-system, sans-serif;
    color: #fff; text-align: center;
  }
  .card::after { /* soft darkening for text contrast, matches the app cards */
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.06), rgba(0,0,0,0.22));
  }
  .inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  .mark { width: 168px; height: 168px; border-radius: 38px; margin-bottom: 34px; filter: drop-shadow(0 12px 30px rgba(0,0,0,0.25)); }
  .wordmark { font-size: 104px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }
  .wordmark .bang { color: #FF8C6A; }
  .tagline { font-size: 34px; font-weight: 700; opacity: 0.82; margin-top: 20px; letter-spacing: 0.01em; }
  .url { position: absolute; bottom: 34px; z-index: 1; font-size: 24px; font-weight: 700; opacity: 0.7; letter-spacing: 0.02em; }
  .wave { position: absolute; left: 0; right: 0; bottom: 0; z-index: 0; }
</style>
</head>
